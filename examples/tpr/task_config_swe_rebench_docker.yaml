# UniAgent SWE-reBench task config for the local Docker sandbox.
# Copied from the public UniAgent task-config schema and scoped to swe_rebench.
# The sandbox image is supplied by each normalized Parquet task row.
# The sandbox backend creates sibling Docker containers through docker.sock.
- name: swe_rebench
  sandbox:
    provider: docker
    runtime_timeout: 7200
    sandbox_kwargs:
      pull_policy: never
  agent:
    name: claude_code
    max_turns: 200
    run_timeout: 4800
    model:
      temperature: 1.0
      top_p: 1.0
      max_total_tokens: 49152
  prompt_template:
    - role: user
      content: |-
        Read the following task description and resolve the issue in the current directory.

        Task description:
        {problem_statement}

        Inspect the relevant code, make the minimal correct changes, and verify
        the result with appropriate tests or checks. Do not modify tests or
        commit changes. Briefly summarize the fix and verification.
