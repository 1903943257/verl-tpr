name: TPR refactor structural checks
on:
  push:
    branches:
      - refactor/tpr-ppo-engine-ring-turn-20261015
  pull_request:
    paths:
      - 'verl/models/mcore/tpr/**'
      - 'verl/workers/engine/megatron/tpr/**'
      - 'verl/experimental/tpr/**'
      - 'tests/models/mcore/tpr/**'
      - '.github/workflows/tpr-refactor-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile refactored Python source without NPU dependencies
        run: |
          python3 -m compileall -q             verl/models/mcore/tpr             verl/workers/engine/megatron/tpr             verl/experimental/tpr             tests/models/mcore/tpr/unit/test_production_architecture.py \
            tests/models/mcore/tpr/parallel/compare_old_new_tpr_tp2cp4_ppo.py
      - name: Check old/new replay shell syntax
        run: |
          bash -n tests/models/mcore/tpr/parallel/run_old_new_tpr_tp2cp4_ppo.sh
          bash -n tests/models/mcore/tpr/parallel/run_old_new_tpr_tp2cp2dp2_ppo.sh
      - name: Check embedded DP2 old/new comparator syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path("tests/models/mcore/tpr/parallel/run_old_new_tpr_tp2cp2dp2_ppo.sh")
          source = path.read_text(encoding="utf-8")
          assert source.count("<<'PY'") == 1
          embedded = source.split("<<'PY'\n", 1)[1].split("\nPY\n", 1)[0]
          ast.parse(embedded, filename=str(path) + ":comparator")
          print("PASS DP2 old/new inline Python comparator syntax")
          PY
      - name: Run stdlib-only structural tests
        run: |
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          test_file = Path("tests/models/mcore/tpr/unit/test_production_architecture.py")
          tests = runpy.run_path(str(test_file))
          total = 0
          for name, fn in sorted(tests.items()):
              if name.startswith("test_") and callable(fn):
                  fn()
                  print("PASS", name)
                  total += 1
          assert total >= 7, f"Expected architecture tests, found {total}"
          print(f"PASS all {total} TPR refactor structural checks")
          PY
      - name: Run dependency-free Ring and Offload regressions
        run: |
          python3 -m unittest -v \
            tests.models.mcore.tpr.unit.test_ring_coalescing_schedule \
            tests.models.mcore.tpr.unit.test_ring_streaming_transport \
            tests.models.mcore.tpr.unit.test_offload_b_gate \
            tests.models.mcore.tpr.unit.test_activation_offload_adapter
      - name: Verify UID-scoped DP placement against exhaustive prefix oracle
        run: |
          python3 - <<'PY'
          import importlib.util
          import itertools
          import sys
          from pathlib import Path

          path = Path("verl/workers/engine/megatron/tpr/placement.py")
          spec = importlib.util.spec_from_file_location("tpr_placement_ci", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          cases = (
              ([[1, 2, 3], [1, 2, 4], [1, 2, 3], [9, 8], [9, 7], [9, 8]],
               ["A", "A", "A", "B", "B", "B"], 2),
              ([[1, 2, 3], [1, 2, 4], [1, 2, 3], [1, 2, 3], [1, 2, 4], [1, 2, 3]],
               ["A", "A", "A", "B", "B", "B"], 3),
              ([[4, 5], [4, 6], [7, 8], [7, 8, 9], [2, 3], [2, 3, 4]],
               ["A", "A", "B", "B", "C", "C"], 2),
          )
          for sequences, uids, dp_size in cases:
              plan = module.plan_dta_dfs(
                  sequences, dp_size, enforce_equal_rows=False, uid_list=uids
              )
              def cost(rows):
                  return len({
                      (uids[i], tuple(sequences[i][:j]))
                      for i in rows
                      for j in range(1, len(sequences[i]) + 1)
                  })
              assert len(plan.partitions) == dp_size
              assert sorted(i for p in plan.partitions for i in p) == list(range(len(sequences)))
              assert plan.tree_tokens_by_rank == tuple(cost(p) for p in plan.partitions)
              assert plan.global_tree_tokens == cost(range(len(sequences)))
              assert plan.duplicated_tree_tokens == sum(plan.tree_tokens_by_rank) - plan.global_tree_tokens
              order = sorted(range(len(sequences)), key=lambda i: (uids[i], sequences[i], i))
              optimal = min(
                  max(cost(order[a:b]) for a, b in zip((0, *cuts), (*cuts, len(order))))
                  for cuts in itertools.combinations(range(1, len(order)), dp_size - 1)
              )
              assert plan.max_tree_tokens == optimal
              print(f"PASS UID-scoped DP{dp_size}: rows={plan.partitions} "
                    f"global_tokens={plan.global_tree_tokens} duplicated={plan.duplicated_tree_tokens}")

          import ast
          import os
          adapter_path = Path("verl/workers/engine/megatron/tpr/adapter.py")
          tree = ast.parse(adapter_path.read_text())
          fn = next(x for x in tree.body if isinstance(x, ast.FunctionDef)
                    and x.name == "_validate_tpr_parallel_sizes")
          namespace = {"os": os}
          exec(compile(ast.Module(body=[fn], type_ignores=[]), str(adapter_path), "exec"), namespace)
          validate = namespace["_validate_tpr_parallel_sizes"]
          sizes = {"TP": 2, "CP": 2, "DP": 2, "PP": 1, "EP": 1}
          for name in ("TPR_EXPERIMENTAL_OFFLINE_DP2", "TPR_RUN_TP2CP2DP2_ONE_STEP",
                       "TPR_RUN_10K_PARALLEL_PARITY", "TPR_10K_PARITY_ONLY"):
              os.environ.pop(name, None)
          try:
              validate(sizes, ppo=True)
          except NotImplementedError:
              pass
          else:
              raise AssertionError("Ungated production DP2 must be rejected")
          os.environ["TPR_EXPERIMENTAL_OFFLINE_DP2"] = "1"
          os.environ["TPR_RUN_TP2CP2DP2_ONE_STEP"] = "1"
          assert validate(sizes, ppo=True) == 2
          print("PASS production TP2CP2DP2 explicit offline gate")
          PY
      - name: Regression-test shared MindSpeed empty-key sanitization
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          from types import SimpleNamespace

          cp4_path = Path("tests/models/mcore/tpr/parallel/test_real_actor_tp2cp4_offline_ppo_npu.py")
          dp2_path = Path("tests/models/mcore/tpr/parallel/test_tpr_tp2cp2dp2_one_step_npu.py")
          cp4_tree = ast.parse(cp4_path.read_text())
          dp2_tree = ast.parse(dp2_path.read_text())
          helper = next(n for n in cp4_tree.body if isinstance(n, ast.FunctionDef)
                        and n.name == "_sanitize_mindspeed_repatch_args")
          for tree in (cp4_tree, dp2_tree):
              runtime = next(n for n in tree.body if isinstance(n, ast.FunctionDef)
                             and n.name == "_runtime")
              assert any(isinstance(n, ast.Call)
                         and isinstance(n.func, ast.Name)
                         and n.func.id == helper.name for n in ast.walk(runtime))
          namespace = {}
          exec(compile(ast.Module(body=[helper], type_ignores=[]), str(cp4_path), "exec"), namespace)
          sanitize = namespace[helper.name]
          args = SimpleNamespace(context_parallel_algo="megatron_cp_algo", preserved=42)
          vars(args)[""] = "launcher-artifact"
          sanitize(args)
          assert vars(args) == {"context_parallel_algo": "megatron_cp_algo", "preserved": 42}
          sanitize(args)  # idempotent
          for value in (3, None):
              bad = SimpleNamespace()
              vars(bad)[""] = value
              try:
                  sanitize(bad)
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("Non-string empty-key value must fail loudly")
          bad = SimpleNamespace()
          vars(bad)["non-key!"] = "unexpected"
          try:
              sanitize(bad)
          except RuntimeError:
              pass
          else:
              raise AssertionError("Unknown malformed key must never be silently dropped")
          print("PASS MindSpeed args sanitizer; TP2CP4 and TP2CP2DP2 both covered")
          PY
      - name: Audit legacy model imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast, collections
          old_names = {'activation_offload','actor_capture','dp_placement','engine_adapter','fixed_topology_scheduler','gated_delta_net','kv_stack','megatron_adapter','module_spec','objective_adapter','prefix_state','rope','segment_event_profiler','segment_executor','segment_plan','shard','tp_validation','tpr_batch_runner','trajectory_tree','trajectory_tree_turn','tree_plan_builder','parallel'}
          for scope in ('verl', 'tests/models/mcore/tpr', 'tests/workers'):
              counts = collections.defaultdict(list)
              for f in Path(scope).rglob('*.py') if Path(scope).exists() else []:
                  try: tree=ast.parse(f.read_text())
                  except (SyntaxError,UnicodeError): continue
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ImportFrom) and node.module:
                          m=node.module
                          if m=='verl.models.mcore.tpr':
                              for alias in node.names:
                                  if alias.name in old_names: counts[alias.name].append(str(f))
                          elif m.startswith('verl.models.mcore.tpr.'):
                              first=m.split('.')[4]
                              if first in old_names: counts[first].append(str(f))
                      elif isinstance(node, ast.Import):
                          for alias in node.names:
                              if alias.name.startswith('verl.models.mcore.tpr.'):
                                  first=alias.name.split('.')[4]
                                  if first in old_names: counts[first].append(str(f))
              print('TPR_IMPORT_AUDIT_SCOPE='+scope)
              for k,v in sorted(counts.items()):
                  print(k, 'imports='+str(len(v)), 'files='+str(len(set(v))), 'ALL_FILES='+repr(sorted(set(v))))
          PY
