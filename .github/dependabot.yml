## Enabled the dependabot to check the dependencies of the project
## Dependabot will open pull requests to update dependencies automatically

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Version-update PRs are paused to keep TPR branch maintenance focused.
    # Dependabot security updates remain independently configurable.
    open-pull-requests-limit: 0
