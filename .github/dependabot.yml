# pip version-update PRs are paused while TPR development branches are consolidated.
# Security updates are controlled separately in repository settings.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Version-update PRs are paused to keep TPR branch maintenance focused.
    # Dependabot security updates remain independently configurable.
    open-pull-requests-limit: 0
